<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/>
<title>JB Health · log endpoint diagnostic</title>
<style>
body{font-family:-apple-system,'DM Sans',sans-serif;background:#FAFCFE;color:#1A1A1A;margin:0;padding:24px;max-width:560px;margin:0 auto;}
h1{font-size:1.1rem;color:#1B3F6B;}
label{display:block;font-size:.85rem;color:#6B7A8D;margin:14px 0 4px;}
input{font-size:1rem;padding:10px;border:1px solid #D4E4F0;border-radius:8px;width:140px;}
button{font-size:1rem;padding:12px 18px;border:0;border-radius:8px;background:#1B3F6B;color:#fff;margin:14px 8px 0 0;}
button.sec{background:#2E86C1;}
pre{background:#EAF4FB;border:1px solid #D4E4F0;border-radius:8px;padding:12px;white-space:pre-wrap;word-break:break-all;font-size:.85rem;}
.verdict{font-weight:600;margin-top:10px;}
</style>
</head>
<body>
<h1>Log endpoint diagnostic</h1>
<p style="font-size:.9rem;color:#6B7A8D;">Runs the exact same send a client page does and shows the raw Worker response. A successful test drops one dummy item in PENDING — reject it in the app.</p>
<label>Page code</label>
<input id="code" value="JB_JB" autocapitalize="characters" autocorrect="off"/>
<div>
<button id="run">Test /log send</button>
<button id="health" class="sec">Check /health</button>
</div>
<div class="verdict" id="verdict"></div>
<pre id="out">—</pre>
<script>
const out=document.getElementById("out"), verdict=document.getElementById("verdict");
function say(v,t){verdict.textContent=v;out.textContent=t;}
async function pageBits(code){
  const r=await fetch(code+"_Programs_Client.html",{cache:"no-cache"});
  if(!r.ok)throw new Error("could not fetch client page ("+r.status+")");
  const h=await r.text();
  const m=h.match(/const CLIENT="([^"]+)", WORKER="([^"]*)", TOKEN="([^"]*)"/);
  if(!m)throw new Error("no CLIENT/WORKER/TOKEN line on that page");
  return {client:m[1],worker:m[2],token:m[3]};
}
document.getElementById("run").onclick=async function(){
  say("Running…","");
  try{
    const code=document.getElementById("code").value.trim();
    const b=await pageBits(code);
    const payload={code:b.client,token:b.token,date:new Date().toISOString().slice(0,10),
      records:[{ex:"Diagnostic test - ignore",weight:1,unit:"kg",sets:1,reps:"1"}]};
    let r;
    try{
      r=await fetch(b.worker.replace(/\/$/,"")+"/log",{method:"POST",
        headers:{"content-type":"application/json"},body:JSON.stringify(payload)});
    }catch(e){
      say("NETWORK/CORS FAILURE — the browser could not complete the request. The deployed Worker is likely missing CORS/OPTIONS handling (older version). Redeploy fixes it.", String(e));
      return;
    }
    const txt=await r.text();
    if(r.ok && txt.indexOf('"ok":true')>=0){
      say("SUCCESS — the Worker accepted the log. Check PENDING in the app and reject the dummy item.", "HTTP "+r.status+"\n"+txt);
    }else{
      say("WORKER REJECTED IT — the reason below is the answer.", "HTTP "+r.status+"\n"+txt);
    }
  }catch(e){say("Test setup failed.", String(e));}
};
document.getElementById("health").onclick=async function(){
  say("Checking…","");
  try{
    const b=await pageBits(document.getElementById("code").value.trim());
    const r=await fetch(b.worker.replace(/\/$/,"")+"/health");
    const txt=await r.text();
    say(r.ok?"Updated Worker is deployed (/health exists).":"/health not found — the OLD Worker is still deployed (redeploy pending).", "HTTP "+r.status+"\n"+txt);
  }catch(e){say("Health check failed (network/CORS).", String(e));}
};
</script>
</body>
</html>
