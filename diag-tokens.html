<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/>
<title>JB Health · KV binding check</title>
<style>
body{font-family:-apple-system,'DM Sans',sans-serif;background:#FAFCFE;color:#1A1A1A;margin:0;padding:24px;max-width:560px;margin:0 auto;}
h1{font-size:1.1rem;color:#1B3F6B;}
p{font-size:.9rem;color:#6B7A8D;}
label{display:block;font-size:.85rem;color:#6B7A8D;margin:14px 0 4px;}
input{font-size:1rem;padding:10px;border:1px solid #D4E4F0;border-radius:8px;width:100%;box-sizing:border-box;}
button{font-size:1rem;padding:12px 18px;border:0;border-radius:8px;background:#1B3F6B;color:#fff;margin:14px 0 0;}
pre{background:#EAF4FB;border:1px solid #D4E4F0;border-radius:8px;padding:12px;white-space:pre-wrap;word-break:break-all;font-size:.85rem;}
.verdict{font-weight:600;margin-top:10px;}
</style>
</head>
<body>
<h1>KV binding check</h1>
<p>Asks the live Worker which client codes it can actually see. Paste your ADMIN_TOKEN (the value used by the app's PENDING tab). It is only sent to your own Worker.</p>
<label>ADMIN_TOKEN</label>
<input id="admin" autocapitalize="none" autocorrect="off" autocomplete="off" placeholder="paste admin token"/>
<button id="run">Check what the Worker sees</button>
<div class="verdict" id="verdict"></div>
<pre id="out">—</pre>
<script>
const WORKER="https://jb-log.james-52d.workers.dev";
const out=document.getElementById("out"), verdict=document.getElementById("verdict");
document.getElementById("run").onclick=async function(){
  verdict.textContent="Checking…"; out.textContent="";
  const admin=document.getElementById("admin").value.trim();
  if(!admin){verdict.textContent="Paste the admin token first.";return;}
  let r,txt;
  try{
    r=await fetch(WORKER+"/tokens",{headers:{"x-jb-admin":admin}});
    txt=await r.text();
  }catch(e){verdict.textContent="Network/CORS failure.";out.textContent=String(e);return;}
  if(r.status===401){verdict.textContent="Admin token rejected — wrong ADMIN_TOKEN value.";out.textContent=txt;return;}
  let j={}; try{j=JSON.parse(txt);}catch(e){}
  const map=(j.map||[]), legacy=(j.legacy||[]);
  const seesJB=map.indexOf("JB_JB")>=0||legacy.indexOf("JB_JB")>=0;
  let v;
  if(map.length===0&&legacy.length===0){
    v="EMPTY — the Worker's JBLOG binding points at a namespace with NO tokens. The binding is aimed at the wrong KV namespace. Fix: Worker → Settings → Bindings → JBLOG → point it at the namespace holding your tokens map.";
  }else if(!seesJB){
    v="Worker sees "+(map.length+legacy.length)+" code(s) but NOT JB_JB. Wrong namespace, or JB_JB missing from this one.";
  }else{
    v="Worker CAN see JB_JB. Binding is correct — so a still-failing log is a hash mismatch, not a binding problem.";
  }
  verdict.textContent=v;
  out.textContent="HTTP "+r.status+"\n\nmap ("+map.length+"): "+map.join(", ")+"\n\nlegacy token: keys ("+legacy.length+"): "+legacy.join(", ");
};
</script>
</body>
</html>
